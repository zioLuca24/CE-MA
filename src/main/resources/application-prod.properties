# Production configuration for Render.com + PostgreSQL
spring.application.name=gestionale-edile
server.port=${PORT:8080}
server.servlet.context-path=/api

# PostgreSQL Database (Render.com)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://dpg-dbgvgm3bc2fs73bnb2v0-a:5432/cema_prod}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool Optimization for Render
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.root=INFO
logging.level.com.edile=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# Disable H2 console in production
spring.h2.console.enabled=false

# Error handling
server.error.include-message=always

# SSL/TLS - Render handles this automatically
server.ssl.enabled=false
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSLMODE:disable}
